services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./app:/backend/app
      - ./tests:/backend/tests
      - ./prisma:/backend/prisma
      # Keep the generated Prisma client out of the bind mount.
      - api_generated:/backend/app/db/generated
      # Uploaded resume originals (Phase 14); extracted text lives in Postgres.
      - resume_data:/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["uv", "run", "arq", "app.worker.settings.WorkerSettings"]
    env_file: .env
    volumes:
      - ./app:/backend/app
      - ./tests:/backend/tests
      - ./prisma:/backend/prisma
      # Own generated-client volume so it never races the api container's.
      - worker_generated:/backend/app/db/generated
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "arq", "--check", "app.worker.settings.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
  api_generated:
  worker_generated:
  resume_data:
